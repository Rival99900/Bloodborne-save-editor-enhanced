name: Publish signed desktop release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v0.5.0)"
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.5.0' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.5.0]'))"
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.5.0' }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || env.RELEASE_TAG }}

      - name: Validate release version
        run: |
          node -e 'const p=require("./package.json"); if (`v${p.version}` !== process.env.RELEASE_TAG) process.exit(1)'
          test -f ".github/release-notes/${RELEASE_TAG}.md"

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit catalog and localization coverage
        run: npm run audit:catalogs

      - name: Verify reviewed effect labels and numeric values
        run: python3 scripts/localization/rebuild_effect_labels.py --check

      - name: Verify multilingual search and update summaries
        run: node scripts/validate_v040_localization.mjs

      - name: Validate presets, comparison and UI strings
        run: |
          node scripts/validate_v050_features.mjs
          node scripts/audit_ui_text.mjs

      - name: Build production frontend
        run: npm run build

      - name: Run native test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  build:
    name: Build signed ${{ matrix.name }} asset
    if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.5.0]'))"
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS installer
            os: windows-latest
            args: "--bundles nsis"
          - name: Ubuntu Linux x64 AppImage
            os: ubuntu-22.04
            args: "--bundles appimage"
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.5.0' }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || env.RELEASE_TAG }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Updater signing secrets are available."

      - name: Build, sign and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "Bloodborne Save Editor Enhanced ${{ env.RELEASE_TAG }}"
          releaseBody: "See the release notes for validated save-safety guidance, installation files and checksums."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "Bloodborne_Save_Editor_Enhanced_[version]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

  publish-updater-manifest:
    name: Publish combined updater manifest
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.5.0' }}

    steps:
      - name: Checkout release source and main history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tag endpoint excludes drafts. Resolve the authenticated list instead.
          release="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -ce --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] |
              if length == 1 then .[0] else error("Expected exactly one matching release") end')"
          release_commit="$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"

          windows_sig_name="$(jq -r '.assets[] | select(.name | endswith(".exe.sig")) | .name' <<<"$release" | head -n1)"
          linux_sig_name="$(jq -r '.assets[] | select(.name | endswith(".AppImage.sig")) | .name' <<<"$release" | head -n1)"
          test "$windows_sig_name" = "Bloodborne_Save_Editor_Enhanced_${version}_x64-setup.exe.sig"
          test "$linux_sig_name" = "Bloodborne_Save_Editor_Enhanced_${version}_amd64.AppImage.sig"
          windows_name="${windows_sig_name%.sig}"
          linux_name="${linux_sig_name%.sig}"

          windows_url="$(jq -r --arg name "$windows_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          windows_sig_url="$(jq -r --arg name "$windows_sig_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          linux_url="$(jq -r --arg name "$linux_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          linux_sig_url="$(jq -r --arg name "$linux_sig_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"

          for required in "$windows_sig_name" "$linux_sig_name" "$windows_url" "$windows_sig_url" "$linux_url" "$linux_sig_url"; do
            test -n "$required" && test "$required" != "null"
          done

          mkdir -p release-signatures
          gh release download "$RELEASE_TAG" --pattern "*.sig" --dir release-signatures
          windows_signature="$(tr -d '\r\n' < "release-signatures/$windows_sig_name")"
          linux_signature="$(tr -d '\r\n' < "release-signatures/$linux_sig_name")"
          test -n "$windows_signature"
          test -n "$linux_signature"

          jq -n \
            --arg version "$version" \
            --argjson localized_notes "$(jq -c --arg version "$version" '.versions[$version] // .default' src/i18n/releaseSummaries.json)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_url "$windows_url" \
            --arg windows_signature "$windows_signature" \
            --arg linux_url "$linux_url" \
            --arg linux_signature "$linux_signature" \
            '{version:$version,notes:$localized_notes.en,localized_notes:$localized_notes,pub_date:$date,platforms:{"windows-x86_64":{url:$windows_url,signature:$windows_signature},"linux-x86_64":{url:$linux_url,signature:$linux_signature}}}' \
            > latest.json

          jq -e '.version and .platforms["windows-x86_64"].url and .platforms["windows-x86_64"].signature and .platforms["linux-x86_64"].url and .platforms["linux-x86_64"].signature' latest.json >/dev/null

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --pattern "*.exe" \
            --pattern "*.AppImage" \
            --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (cd release-assets && sha256sum * | sort -k2) > SHA256SUMS.txt
          test -s SHA256SUMS.txt

          gh release upload "$RELEASE_TAG" latest.json SHA256SUMS.txt --clobber

          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if test -f "$notes_file"; then
            gh release edit "$RELEASE_TAG" \
              --title "Bloodborne Save Editor Enhanced ${RELEASE_TAG}" \
              --notes-file "$notes_file" \
              --target "$release_commit" \
              --draft=false \
              --latest
          fi

          git fetch origin main
          git checkout -B updater-publication origin/main
          mkdir -p .github/updater
          cp latest.json .github/updater/latest.json
          git config user.name "Rival99900"
          git config user.email "88095648+Rival99900@users.noreply.github.com"
          git add .github/updater/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish updater manifest for ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
