name: Publish signed desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v0.3.0)"
        required: true
        type: string

jobs:
  build:
    name: Build signed ${{ matrix.name }} asset
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS installer
            os: windows-latest
            args: "--bundles nsis"
          - name: Ubuntu Linux x64 AppImage
            os: ubuntu-22.04
            args: "--bundles appimage"
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Updater signing secrets are available."

      - name: Build, sign and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Bloodborne Save Editor Enhanced ${{ env.RELEASE_TAG }}"
          releaseBody: "See the release notes for validated save-safety guidance, installation files and checksums."
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "Bloodborne_Save_Editor_Enhanced_[version]_[arch][setup].[ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

  publish-updater-manifest:
    name: Publish combined updater manifest
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout main for fallback manifest publication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          version="${RELEASE_TAG#v}"

          windows_url="$(jq -r '.assets[] | select(.name | endswith("-setup.exe")) | .browser_download_url' <<<"$release" | head -n1)"
          windows_sig_url="$(jq -r '.assets[] | select(.name | endswith(".exe.sig")) | .browser_download_url' <<<"$release" | head -n1)"
          linux_url="$(jq -r '.assets[] | select(.name | endswith(".AppImage")) | .browser_download_url' <<<"$release" | head -n1)"
          linux_sig_url="$(jq -r '.assets[] | select(.name | endswith(".AppImage.sig")) | .browser_download_url' <<<"$release" | head -n1)"

          for required in "$windows_url" "$windows_sig_url" "$linux_url" "$linux_sig_url"; do
            test -n "$required" && test "$required" != "null"
          done

          windows_signature="$(curl --fail --location --silent --show-error "$windows_sig_url" | tr -d '\r\n')"
          linux_signature="$(curl --fail --location --silent --show-error "$linux_sig_url" | tr -d '\r\n')"
          test -n "$windows_signature"
          test -n "$linux_signature"

          jq -n \
            --arg version "$version" \
            --arg notes "See the GitHub release for improvements and safe-save guidance." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_url "$windows_url" \
            --arg windows_signature "$windows_signature" \
            --arg linux_url "$linux_url" \
            --arg linux_signature "$linux_signature" \
            '{version:$version,notes:$notes,pub_date:$date,platforms:{"windows-x86_64":{url:$windows_url,signature:$windows_signature},"linux-x86_64":{url:$linux_url,signature:$linux_signature}}}' \
            > latest.json

          jq -e '.version and .platforms["windows-x86_64"].url and .platforms["windows-x86_64"].signature and .platforms["linux-x86_64"].url and .platforms["linux-x86_64"].signature' latest.json >/dev/null
          gh release upload "$RELEASE_TAG" latest.json --clobber

          mkdir -p .github/updater
          cp latest.json .github/updater/latest.json
          git config user.name "Rival99900"
          git config user.email "88095648+Rival99900@users.noreply.github.com"
          git add .github/updater/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish updater manifest for ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
