name: Publish signed desktop release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      # Versioned main commits launch these releases; exclude tag creation to avoid duplicate builds.
      - "!v0.5.0"
      - "!v0.6.0"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v0.6.0)"
        required: true
        type: string
      refresh_existing:
        description: "Replace the existing v0.6.0 packages from the selected branch (same version)"
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-release-${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.6.0' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release v0.6.0]') || contains(github.event.head_commit.message, '[refresh v0.6.0]')))"
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.6.0' }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'push' && github.ref_type == 'branch' || inputs.refresh_existing) && github.sha || env.RELEASE_TAG }}

      - name: Validate release version
        run: |
          node -e 'const p=require("./package.json"); if (`v${p.version}` !== process.env.RELEASE_TAG) process.exit(1)'
          test -f ".github/release-notes/${RELEASE_TAG}.md"

      - name: Test release draft preparation
        run: |
          python3 .github/scripts/test_prepare_release.py
          python3 .github/scripts/test_updater_manifest.py

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit catalog and localization coverage
        run: npm run audit:catalogs

      - name: Verify reviewed effect labels and numeric values
        run: python3 .github/scripts/localization/rebuild_effect_labels.py --check

      - name: Verify multilingual search and update summaries
        run: node .github/scripts/validate_v040_localization.mjs

      - name: Validate presets, comparison and UI strings
        run: |
          node .github/scripts/validate_v050_features.mjs
          node .github/scripts/validate_v060_patches.mjs
          node .github/scripts/audit_ui_text.mjs

      - name: Build production frontend
        run: npm run build

      - name: Run native test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets


  prepare-release:
    name: Prepare release under repository owner
    needs: validate
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.6.0' }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # An explicit refresh commit on main replaces the same owner release.
      REFRESH_EXISTING_RELEASE: ${{ (inputs.refresh_existing || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[refresh v0.6.0]'))) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'push' && github.ref_type == 'branch' || inputs.refresh_existing) && github.sha || env.RELEASE_TAG }}
      - name: Validate owner and prepare draft
        id: prepare
        run: bash .github/scripts/prepare_release.sh

  build:
    name: Build signed ${{ matrix.name }} asset
    if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release v0.6.0]') || contains(github.event.head_commit.message, '[refresh v0.6.0]')))"
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS installer
            os: windows-latest
            args: "--bundles nsis"
          - name: Ubuntu Linux x64 AppImage
            os: ubuntu-22.04
            args: "--bundles appimage"
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.6.0' }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'push' && github.ref_type == 'branch' || inputs.refresh_existing) && github.sha || env.RELEASE_TAG }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Updater signing secrets are available."

      - name: Build, sign and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "Bloodborne Save Editor Enhanced ${{ env.RELEASE_TAG }}"
          releaseBody: "See the release notes for validated save-safety guidance, installation files and checksums."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "Bloodborne_Save_Editor_Enhanced_[version]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

  publish-updater-manifest:
    name: Publish combined updater manifest
    needs: [prepare-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.6.0' }}

    steps:
      - name: Checkout release source and main history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.refresh_existing && github.sha || inputs.tag || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Use the exact draft prepared upstream, including on the first run.
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == true and .author.login == "Rival99900"' <<<"$release" >/dev/null
          release_commit="$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"

          printf '%s\n' "$release" > release-metadata.json
          mkdir -p release-signatures
          gh release download "$RELEASE_TAG" --pattern "*.sig" --dir release-signatures
          python3 .github/scripts/build_updater_manifest.py \
            --release release-metadata.json --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --signatures release-signatures \
            --notes src/i18n/releaseSummaries.json --output latest.json

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --pattern "*.exe" \
            --pattern "*.AppImage" \
            --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (cd release-assets && sha256sum * | sort -k2) > SHA256SUMS.txt
          test -s SHA256SUMS.txt

          gh release upload "$RELEASE_TAG" latest.json SHA256SUMS.txt --clobber

          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if test -f "$notes_file"; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f tag_name="$RELEASE_TAG" \
              -f name="Bloodborne Save Editor Enhanced ${RELEASE_TAG}" \
              -F "body=@${notes_file}" \
              -f target_commitish="$release_commit" \
              -F draft=false \
              -f make_latest=true >/dev/null
          fi

          # Check the permanent public URLs before advertising the new update.
          while IFS= read -r asset_url; do
            curl --fail --silent --show-error --location --head --retry 3 "$asset_url" >/dev/null
          done < <(jq -r '.platforms[].url' latest.json)

          git fetch origin main
          git checkout -B updater-publication origin/main
          mkdir -p .github/updater
          cp latest.json .github/updater/latest.json
          git config user.name "Rival99900"
          git config user.email "88095648+Rival99900@users.noreply.github.com"
          git add .github/updater/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish updater manifest for ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
