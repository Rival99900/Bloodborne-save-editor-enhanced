name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string

jobs:
  publish-windows:
    name: Publish signed Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($Env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is missing.'
          }
          if ([string]::IsNullOrWhiteSpace($Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing.'
          }
          Write-Host 'Updater signing configuration is present.'

      - name: Build and publish the Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          # When RELEASE_TOKEN is configured as a fine-grained personal access token for
          # Rival99900, the release is created under that account. The built-in token remains
          # a safe fallback so installer builds keep working until the token is added.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Bloodborne Save Editor Enhanced ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## Improvements
            - Refined responsive layout for the gem and rune editor.
            - Personal Gem Forge presets can be saved and reused locally.
            - `Ctrl+O` opens a save and `Ctrl+S` saves changes.

            ## Fixes and safeguards
            - Effect controls, long lists and editor actions stay within the visible workspace.
            - The Add dialog has a visible close control, Escape handling and bounded scrolling.
            - Closing with unsaved changes asks whether to save, discard or cancel.
            - The updater verifies every package against the embedded public signing key.
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: "--bundles nsis"
          releaseAssetNamePattern: "Bloodborne_Save_Editor_Enhanced_[version]_[arch][setup].[ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Publish the updater manifest outside the release assets
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $config.version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer was not generated.' }

          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw 'The updater signature was not generated.' }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'The updater signature is empty.' }

          $releaseAsset = "Bloodborne_Save_Editor_Enhanced_${version}_x64-setup.exe"
          $manifest = @{
            version = $version
            notes = "See the GitHub release for improvements and safe-save guidance."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/Rival99900/Bloodborne-save-editor-enhanced/releases/download/$env:RELEASE_TAG/$releaseAsset"
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5

          New-Item -ItemType Directory -Force ".github/updater" | Out-Null
          Set-Content -Path ".github/updater/latest.json" -Value $manifest -Encoding utf8
          git config user.name "Rival99900"
          git config user.email "88095648+Rival99900@users.noreply.github.com"
          git add .github/updater/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore: publish updater manifest for v$version"
            git push origin HEAD:main
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect updater manifest changes.'
          }
