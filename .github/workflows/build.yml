name: Publish signed desktop release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v0.3.0)"
        required: true
        type: string

jobs:
  validate:
    name: Validate tagged source
    if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish corrected v0.4.0')"
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.4.0' }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || env.RELEASE_TAG }}

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit catalog and localization coverage
        run: npm run audit:catalogs

      - name: Verify multilingual search and update summaries
        run: node scripts/validate_v040_localization.mjs

      - name: Build production frontend
        run: npm run build

      - name: Run native test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  build:
    name: Build signed ${{ matrix.name }} asset
    if: "github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish corrected v0.4.0')"
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS installer
            os: windows-latest
            args: "--bundles nsis"
          - name: Ubuntu Linux x64 AppImage
            os: ubuntu-22.04
            args: "--bundles appimage"
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.4.0' }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.sha || env.RELEASE_TAG }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Updater signing secrets are available."

      - name: Build, sign and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Bloodborne Save Editor Enhanced ${{ env.RELEASE_TAG }}"
          releaseBody: "See the release notes for validated save-safety guidance, installation files and checksums."
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "Bloodborne_Save_Editor_Enhanced_[version]_[arch][setup].[ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

  publish-updater-manifest:
    name: Publish combined updater manifest
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v0.4.0' }}

    steps:
      - name: Checkout main for fallback manifest publication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align republished tag with validated source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PREVIOUS_TAG: e6a097a1a91bb8282c50961a38870247e5eb47c8
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.4.0" --jq '.object.sha')"
          if test "$current" != "$EXPECTED_PREVIOUS_TAG" && test "$current" != "$GITHUB_SHA"; then
            echo "The release tag changed unexpectedly; refusing to overwrite it."
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.4.0" \
            --field sha="$GITHUB_SHA" --field force=true

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          version="${RELEASE_TAG#v}"

          windows_sig_name="$(jq -r '.assets[] | select(.name | endswith(".exe.sig")) | .name' <<<"$release" | head -n1)"
          linux_sig_name="$(jq -r '.assets[] | select(.name | endswith(".AppImage.sig")) | .name' <<<"$release" | head -n1)"
          windows_name="${windows_sig_name%.sig}"
          linux_name="${linux_sig_name%.sig}"

          windows_url="$(jq -r --arg name "$windows_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          windows_sig_url="$(jq -r --arg name "$windows_sig_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          linux_url="$(jq -r --arg name "$linux_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"
          linux_sig_url="$(jq -r --arg name "$linux_sig_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$release")"

          for required in "$windows_sig_name" "$linux_sig_name" "$windows_url" "$windows_sig_url" "$linux_url" "$linux_sig_url"; do
            test -n "$required" && test "$required" != "null"
          done

          windows_signature="$(curl --fail --location --silent --show-error "$windows_sig_url" | tr -d '\r\n')"
          linux_signature="$(curl --fail --location --silent --show-error "$linux_sig_url" | tr -d '\r\n')"
          test -n "$windows_signature"
          test -n "$linux_signature"

          jq -n \
            --arg version "$version" \
            --argjson localized_notes "$(jq -c --arg version "$version" '.versions[$version] // .default' src/i18n/releaseSummaries.json)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_url "$windows_url" \
            --arg windows_signature "$windows_signature" \
            --arg linux_url "$linux_url" \
            --arg linux_signature "$linux_signature" \
            '{version:$version,notes:$localized_notes.en,localized_notes:$localized_notes,pub_date:$date,platforms:{"windows-x86_64":{url:$windows_url,signature:$windows_signature},"linux-x86_64":{url:$linux_url,signature:$linux_signature}}}' \
            > latest.json

          jq -e '.version and .platforms["windows-x86_64"].url and .platforms["windows-x86_64"].signature and .platforms["linux-x86_64"].url and .platforms["linux-x86_64"].signature' latest.json >/dev/null

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --pattern "*.exe" \
            --pattern "*.AppImage" \
            --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (cd release-assets && sha256sum * | sort -k2) > SHA256SUMS.txt
          test -s SHA256SUMS.txt

          gh release upload "$RELEASE_TAG" latest.json SHA256SUMS.txt --clobber

          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if test -f "$notes_file"; then
            gh release edit "$RELEASE_TAG" \
              --title "Bloodborne Save Editor Enhanced ${RELEASE_TAG}" \
              --notes-file "$notes_file" \
              --latest
          fi

          mkdir -p .github/updater
          cp latest.json .github/updater/latest.json
          git config user.name "Rival99900"
          git config user.email "88095648+Rival99900@users.noreply.github.com"
          git add .github/updater/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish updater manifest for ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
