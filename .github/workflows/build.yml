name: Publish signed desktop release

# A release is built from main when the commit message contains "[release]"
# (or "[refresh]" to replace the packages of the same version). The version
# and the tag come from package.json: nothing to edit here for a new version.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v0.7.0)"
        required: true
        type: string
      refresh_existing:
        description: "Replace the existing packages of this tag from the selected branch (same version)"
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  version:
    name: Read release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      run: ${{ steps.version.outputs.run }}
      refresh: ${{ steps.version.outputs.refresh }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && !inputs.refresh_existing && inputs.tag || github.sha }}
      - id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REFRESH: ${{ inputs.refresh_existing }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          run=false; refresh=false; ref="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            run=true
            if [ "$INPUT_REFRESH" = "true" ]; then refresh=true; else ref="$INPUT_TAG"; fi
            tag="$INPUT_TAG"
          else
            # "[release]", or the older "[release vX.Y.Z]" form for this exact version.
            if grep -qE "\[release( ${tag//./\\.})?\]" <<<"$MESSAGE"; then run=true; fi
            if grep -qE "\[refresh( ${tag//./\\.})?\]" <<<"$MESSAGE"; then run=true; refresh=true; fi
          fi
          { echo "tag=$tag"; echo "run=$run"; echo "refresh=$refresh"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"
          echo "Release $tag: run=$run refresh=$refresh"

  validate:
    name: Validate tagged source
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Validate release version
        run: |
          node -e 'const p=require("./package.json"); if (`v${p.version}` !== process.env.RELEASE_TAG) process.exit(1)'
          test -f ".github/release-notes/${RELEASE_TAG}.md"

      - name: Test release draft preparation
        run: |
          python3 .github/scripts/test_prepare_release.py
          python3 .github/scripts/test_updater_manifest.py

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify reviewed effect labels and numeric values
        run: python3 .github/scripts/localization/rebuild_effect_labels.py --check

      - name: Lint the frontend
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run frontend unit tests
        run: npm test

      - name: Validate locales, catalogues and features
        run: npm run validate

      - name: Check the native code format and lints
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build production frontend
        run: npm run build

      - name: Run native test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  prepare-release:
    name: Prepare release under repository owner
    needs: [version, validate]
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # An explicit refresh commit on main replaces the same owner release.
      REFRESH_EXISTING_RELEASE: ${{ needs.version.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Validate owner and prepare draft
        id: prepare
        run: bash .github/scripts/prepare_release.sh

  build:
    name: Build signed ${{ matrix.name }} asset
    needs: [version, prepare-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS installer and MSI package
            os: windows-latest
            args: "--bundles nsis,msi"
          - name: Ubuntu Linux x64 AppImage
            os: ubuntu-22.04
            args: "--bundles appimage"
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify signing secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Updater signing secrets are available."

      - name: Build, sign and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "Bloodborne Save Editor Enhanced ${{ env.RELEASE_TAG }}"
          releaseBody: "See the release notes for validated save-safety guidance, installation files and checksums."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "Bloodborne_Save_Editor_Enhanced_[version]_[arch][setup][ext]"
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

  publish-updater-manifest:
    name: Publish combined updater manifest
    needs: [version, prepare-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}

    steps:
      - name: Checkout release source and main history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Use the exact draft prepared upstream, including on the first run.
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == true and .author.login == "Rival99900"' <<<"$release" >/dev/null
          release_commit="$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"

          printf '%s\n' "$release" > release-metadata.json
          mkdir -p release-signatures
          gh release download "$RELEASE_TAG" --pattern "*.sig" --dir release-signatures
          python3 .github/scripts/build_updater_manifest.py \
            --release release-metadata.json --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --signatures release-signatures \
            --notes src/i18n/releaseSummaries.json --output latest.json

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --pattern "*.exe" \
            --pattern "*.msi" \
            --pattern "*.AppImage" \
            --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          (cd release-assets && sha256sum * | sort -k2) > SHA256SUMS.txt
          test -s SHA256SUMS.txt

          gh release upload "$RELEASE_TAG" latest.json SHA256SUMS.txt --clobber

          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if test -f "$notes_file"; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f tag_name="$RELEASE_TAG" \
              -f name="Bloodborne Save Editor Enhanced ${RELEASE_TAG}" \
              -F "body=@${notes_file}" \
              -f target_commitish="$release_commit" \
              -F draft=false \
              -f make_latest=true >/dev/null
          fi

          # Check the permanent public URLs before advertising the new update.
          while IFS= read -r asset_url; do
            curl --fail --silent --show-error --location --head --retry 3 "$asset_url" >/dev/null
          done < <(jq -r '.platforms[].url' latest.json)

          git fetch origin main
          git checkout -B updater-publication origin/main
          mkdir -p .github/updater
          cp latest.json .github/updater/latest.json
          git config user.name "Rival99900"
          git config user.email "88095648+Rival99900@users.noreply.github.com"
          git add .github/updater/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish updater manifest for ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
